<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1 user-scalable=no" />
        <link rel="icon" href="favicon.ico" />
        <title>Cut the Rope: Magic</title>
        <style>
            body,
            html {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                -ms-touch-action: none;
                touch-action: none;
                overflow: hidden;
                background: url(tilebg.jpg);
                background-repeat: repeat;
            }

            * {
                -webkit-touch-callout: none;
                /* iOS Safari */
                -webkit-user-select: none;
                /* Safari */
                -khtml-user-select: none;
                /* Konqueror HTML */
                -moz-user-select: none;
                /* Old versions of Firefox */
                -ms-user-select: none;
                /* Internet Explorer/Edge */
                user-select: none;
                /* Non-prefixed version, currently supported by Chrome, Opera and Firefox */
                -ms-touch-action: none;
                -ms-content-zooming: none;
                touch-action: none;
                outline: none;
            }

            .ctrCursor {
                cursor: url(cursors/cursor.cur), url(cursors/cursor.png), auto;
            }
        </style>
        <script>
            const alertFn = window.alert;
            window.alert = (message) => {
                if (message.startsWith("GamePix SDK log:")) {
                    console.log(message);
                    return;
                }
                alertFn(message);
            };
        </script>

        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-SX3SJWCLEY"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-SX3SJWCLEY");
        </script>
        <script
            async
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3324915803425189"
            crossorigin="anonymous"></script>
        <script src="gamepix.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css" />
    </head>
    <body class="ctrCursor">
        <canvas id="canvas" tabindex="0"></canvas>
        <script>
            function getParameterByName(name, url) {
                name = name.replace(/[\[\]]/g, "\\$&");
                const regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                    results = regex.exec(url);
                if (!results) return null;
                if (!results[2]) return "";
                return decodeURIComponent(results[2].replace(/\+/g, " "));
            }

            if (getParameterByName("autorun", window.location.href) !== "0") {
                const createScript = function () {
                    const el = document.createElement("script");
                    el.onload = function () {
                        tinyLoader.load();
                    };
                    el.src = "scripts/tiny-loader.js";
                    return el;
                };

                const corsScript = createScript();
                corsScript.onerror = function () {
                    document.body.removeChild(corsScript);
                    const el = createScript();
                    el.onerror = console.error;
                    document.body.appendChild(el);
                };

                corsScript.setAttribute("crossorigin", "anonymous");
                document.body.appendChild(corsScript);
            }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
        <script>
            const notyf = new Notyf({
                types: [
                    {
                        type: "info",
                        duration: 0,
                        background: "#2563eb", // Set the background color for progress toast
                    },
                ],
            });
        </script>
        <script src="register-sw.js"></script>
    </body>
</html>
